name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.0
      - run: forge fmt --check
      - run: forge lint src script --severity high med --deny warnings
      - run: forge test --network monad
      - run: forge snapshot --network monad --check
      - run: forge build --sizes
